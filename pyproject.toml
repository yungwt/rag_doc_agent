[project]
name = "rag-doc-agent"
version = "0.1.0"
description = "基于 FastAPI + RAG 的多租户智能知识库系统"
readme = "README.md"
authors = [
    { name = "yungwt", email = "13434996280@163.com" }
]
requires-python = ">=3.11"
dependencies = [
    "aiomysql==0.2.0",
    "dashscope>=1.14.0",
    "email-validator>=2.0.0",
    "fastapi==0.136.1",
    "langchain-chroma==1.1.0",
    "langchain-community==0.4.1",
    "langchain-core==1.3.2",
    "langchain-openai==1.2.1",
    "langchain-text-splitters==1.1.2",
    "pydantic==2.13.3",
    "pypdf>=4.0.0",
    "python-dotenv==1.2.2",
    "bcrypt>=4.0.0,<5.0.0",
    "python-jose==3.5.0",
    "python-multipart>=0.0.9",
    "redis==7.4.0",
    "sqlalchemy==2.0.49",
    "uvicorn==0.30.6",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
